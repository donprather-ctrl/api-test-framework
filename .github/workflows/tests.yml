name: Run tests
on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Debug secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          DEFAULT_USER: ${{ secrets.DEFAULT_USER }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: |
          echo "BASE_URL is set: ${{ secrets.BASE_URL != '' }}"
          echo "DEFAULT_USER is set: ${{ secrets.DEFAULT_USER != '' }}"
          echo "DEFAULT_PASSWORD is set: ${{ secrets.DEFAULT_PASSWORD != '' }}"
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          DEFAULT_USER: ${{ secrets.DEFAULT_USER }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: pytest -m smoke -v
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/report.html

  regression:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run regression tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          DEFAULT_USER: ${{ secrets.DEFAULT_USER }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: pytest -m regression -v
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/report.html